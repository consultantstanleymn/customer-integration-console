name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Dependency audit
        run: npm audit --audit-level=high

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cic, POSTGRES_PASSWORD: ci, POSTGRES_DB: cic_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cic" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cic:ci@localhost:5432/cic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Authorization matrix is current
        run: |
          npm run authz-matrix -w api
          git diff --exit-code docs/engagement/evidence/authz-matrix.md

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cic, POSTGRES_PASSWORD: ci, POSTGRES_DB: cic_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cic" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cic:ci@localhost:5432/cic_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t cic-api .
      - run: docker build -f web/Dockerfile --build-arg API_URL=http://api:4000 -t cic-web .
      - run: docker build -f mocks/Dockerfile -t cic-mocks .
      - run: docker compose config --quiet

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/*.yaml

  # Held-out identity provider suite. Manual only. Authored, not run.
  keycloak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cic, POSTGRES_PASSWORD: ci, POSTGRES_DB: cic_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cic" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cic:ci@localhost:5432/cic_test
      KC_ADMIN_PASSWORD: local-test-only-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ./scripts/keycloak-heldout.sh
