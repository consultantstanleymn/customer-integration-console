# Only the web service is public. It proxies /api/* to the API inside the cluster,
# so /metrics on the API is not reachable from the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: integration-console
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [console.customer.example]
      secretName: console-tls
  rules:
    - host: console.customer.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
